  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}

  .hero{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:clamp(40px,8vh,90px) clamp(20px,5.6vw,60px);text-align:center}
  .hero-bg{position:absolute;inset:0;background-color:#E8D3C4;
    background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22104%22%20height%3D%2260%22%20viewBox%3D%220%200%20104%2060%22%3E%3Crect%20width%3D%22104%22%20height%3D%2260%22%20fill%3D%22%23E8D3C4%22%2F%3E%3Crect%20width%3D%2252%22%20height%3D%2260%22%20fill%3D%22%2396122B%22%2F%3E%3C%2Fsvg%3E");
    background-size:229px 132px;z-index:0}
  .hero-bg::after{content:"";position:absolute;inset:0;background-image:var(--tex-linen);
    background-size:240px;mix-blend-mode:soft-light;opacity:.45}

  .card{position:relative;z-index:2;width:min(460px,92vw);text-align:center;
    background-color:var(--paper);background-image:var(--tex-paper);
    background-size:520px;background-blend-mode:multiply;
    padding:clamp(36px,6vw,54px) clamp(26px,4.6vw,40px) clamp(30px,5vw,38px);
    box-shadow:0 40px 80px -30px rgba(23,19,16,.55),
               inset 0 0 90px rgba(150,118,74,.14),
               inset 0 0 26px rgba(120,92,52,.10)}

  .kick{display:block;font-family:var(--sans);font-weight:500;font-size:11px;letter-spacing:.4em;
    text-transform:uppercase;color:var(--bordo);margin-bottom:16px}
  .title{font-family:var(--display);font-weight:800;font-stretch:125%;text-transform:lowercase;
    letter-spacing:-.02em;line-height:.92;font-size:clamp(2.2rem,9vw,3.2rem);color:var(--bordo);margin-bottom:.3em}
  .lede{font-family:var(--serif);font-size:clamp(15px,1.9vw,18px);line-height:1.65;color:#1C1512;
    max-width:34ch;margin:0 auto 24px}

  .badge{display:inline-block;padding:.7em 1.5em;background:var(--bordo);color:var(--bege-l);
    border-radius:999px;font-family:var(--sans);font-weight:700;font-size:clamp(12px,1.6vw,15px);
    letter-spacing:.12em;text-transform:uppercase;box-shadow:0 14px 28px -10px rgba(23,19,16,.5);
    margin-bottom:26px}
